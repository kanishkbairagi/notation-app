<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Stylized "N" interlaced with graph network nodes -->
  <!-- Left Pillar -->
  <line x1="20" y1="44" x2="20" y2="20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <!-- Diagonal -->
  <line x1="20" y1="20" x2="44" y2="44" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <!-- Right Pillar -->
  <line x1="44" y1="20" x2="44" y2="44" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  
  <!-- Graph network node points on vertices -->
  <circle cx="20" cy="20" r="4.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="20" cy="44" r="4" fill="#93C5FD" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="44" cy="20" r="4" fill="#93C5FD" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="44" cy="44" r="4.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2" />
</svg>
